<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>โปรไฟล์ · ygiaphan</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/main.css?v=20260518">
<style>
  .me-wrap{max-width:760px;margin:32px auto;padding:0 16px}
  .me-hero{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
  .me-hero img{width:72px;height:72px;border-radius:50%;border:2px solid var(--brand-bg)}
  .me-hero h1{margin:0;font-size:1.3rem;color:var(--brand)}
  .me-hero .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .me-tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px}
  .me-tab{padding:10px 18px;cursor:pointer;border:none;background:none;font:inherit;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px}
  .me-tab.active{color:var(--brand);border-bottom-color:var(--brand)}
  .me-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px}
  .me-card--link{display:block;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s}
  .me-card--link:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--brand);text-decoration:none}
  .me-card--link h3{color:var(--brand)}
  .me-card h3{margin:0 0 4px;font-size:1rem}
  .me-card .meta{color:var(--muted);font-size:.85rem}
  .me-empty{text-align:center;color:var(--muted);padding:32px}
  .pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600}
  .pill--pending{background:#fff3cd;color:#856404}
  .pill--paid{background:#d4edda;color:#155724}
  .pill--cancel{background:#fde2e0;color:#a03020}
  .me-actions{margin-top:16px;text-align:right}
  .btn--ghost{background:none;border:1px solid var(--line);color:var(--fg);padding:8px 16px;border-radius:8px;cursor:pointer}
  .btn--ghost:hover{background:var(--brand-bg)}
</style>
</head>
<body>
<div data-include="header"></div>

<main class="me-wrap">
  <div id="loading" style="text-align:center;padding:40px"><span class="yp-spinner"></span> กำลังโหลด…</div>

  <div id="content" hidden>
    <div class="me-hero">
      <img id="meAvatar" src="" alt="" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='assets/img/favicon.svg'">
      <div style="flex:1">
        <h1 id="meName"></h1>
        <p class="sub" id="meEmail"></p>
        <p class="sub" id="meProvider"></p>
      </div>
      <button class="btn--ghost" id="logoutBtn">ออกจากระบบ</button>
    </div>

    <div class="me-tabs">
      <button class="me-tab active" data-tab="vocab">🎴 ทบทวนศัพท์ <span id="vocabBadge" class="ad-badge" hidden></span></button>
      <button class="me-tab" data-tab="bookmarks">⭐ Bookmarks</button>
      <button class="me-tab" data-tab="orders">🛒 คำสั่งซื้อ</button>
      <button class="me-tab" data-tab="leaderboard">🏆 อันดับ</button>
    </div>

    <div id="tab-vocab" class="tab-pane"></div>
    <div id="tab-bookmarks" class="tab-pane" hidden></div>
    <div id="tab-orders" class="tab-pane" hidden></div>
    <div id="tab-leaderboard" class="tab-pane" hidden></div>
  </div>
</main>

<div data-include="footer"></div>

<script src="content/config.js"></script>
<script src="content/i18n/vi.js"></script>
<script src="content/i18n/th.js"></script>
<script src="content/site.js"></script>
<script src="content/nav.js"></script>
<script src="assets/js/pwa.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/card.js"></script>
<script>
const $ = s => document.querySelector(s);

if (!window.YP_AUTH.requireLogin()) {/* will redirect */} else (async () => {
  const meR = await window.YP_AUTH.me();
  if (!meR || !meR.ok){ window.YP_AUTH.setToken(''); location.href='login.html'; return; }
  const u = meR.user;
  $('#meAvatar').src = u.avatar || 'assets/img/favicon.svg';
  $('#meName').textContent = u.name || u.email;
  $('#meEmail').textContent = u.email;
  $('#meProvider').textContent = 'login ผ่าน: ' + (u.provider || 'email');
  $('#loading').hidden = true;
  $('#content').hidden = false;

  // Tabs
  function switchTab(name){
    document.querySelectorAll('.me-tab').forEach(x => x.classList.toggle('active', x.dataset.tab===name));
    document.querySelectorAll('.tab-pane').forEach(p => p.hidden = (p.id !== 'tab-'+name));
    history.replaceState(null,'','#'+name);
  }
  document.querySelectorAll('.me-tab').forEach(t => t.onclick = () => switchTab(t.dataset.tab));
  // เปิดตาม hash ใน URL (#vocab, #bookmarks, ...)
  const initial = (location.hash||'#vocab').slice(1);
  if (['vocab','bookmarks','orders','leaderboard'].includes(initial)) switchTab(initial);

  // Bookmarks
  const bm = await window.YP_API.bookmarkList();
  const bmEl = $('#tab-bookmarks');
  if (bm.ok && bm.slugs.length){
    if (window.YP_API.loadPosts) { try { await window.YP_API.loadPosts(); } catch(e){} }
    const posts = window.YP_POSTS || {};
    bmEl.innerHTML = bm.slugs.map(s => {
      const p = posts[s] || {};
      const title = window.pickL ? (window.pickL(p,'title')||s) : (p.title_th||p.title_vi||s);
      const desc  = window.pickL ? (window.pickL(p,'desc')||'')  : (p.desc_th||p.desc_vi||'');
      const icon  = p.icon || '📖';
      return `<a class="me-card me-card--link" href="post.html?slug=${encodeURIComponent(s)}">
        <h3>${icon} ${title}</h3>
        ${desc?`<p class="meta">${desc}</p>`:''}
      </a>`;
    }).join('');
  } else {
    bmEl.innerHTML = '<div class="me-empty">ยังไม่มีบทความที่บันทึกไว้<br><small>กดรูป ⭐ ในหน้าบทความเพื่อบันทึก</small></div>';
  }

  // Orders
  const od = await window.YP_API.myOrders();
  const odEl = $('#tab-orders');
  if (od.ok && od.orders.length){
    odEl.innerHTML = od.orders.map(o => {
      const cls = o.status==='paid'?'paid':(o.status==='cancelled'?'cancel':'pending');
      const date = o.created_at ? new Date(+o.created_at).toLocaleDateString('th-TH') : '';
      return `<div class="me-card">
        <h3>${o.item_title}</h3>
        <p class="meta">${date} · ${o.amount} ${o.currency} · <span class="pill pill--${cls}">${o.status}</span></p>
        ${o.slip_url?`<p class="meta"><a href="${o.slip_url}" target="_blank">ดูสลิป →</a></p>`:''}
      </div>`;
    }).join('');
  } else {
    odEl.innerHTML = '<div class="me-empty">ยังไม่มีคำสั่งซื้อ<br><small><a href="courses.html">ดูคอร์ส →</a></small></div>';
  }

  // Vocab review (Flashcard) + Library
  const vEl = $('#tab-vocab');
  const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function speak(text, lang){
    try{
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang||'vi-VN'; u.rate = .85;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }catch(_){}
  }
  let kbHandler = null;
  function unbindKb(){ if (kbHandler) document.removeEventListener('keydown', kbHandler); kbHandler = null; }

  async function renderVocab(){
    unbindKb();
    const r = await window.YP_API.vocabDue();
    if (!r.ok || !r.items.length){
      vEl.innerHTML = `
        <div class="me-empty">✓ ไม่มีศัพท์ที่ต้องทบทวนตอนนี้<br><small>ไปบันทึกศัพท์จากบทความได้เลย</small></div>
        <div style="text-align:center;margin-top:10px"><button class="btn--ghost" id="vlib">📖 ดูคลังศัพท์ทั้งหมด</button></div>`;
      $('#vocabBadge').hidden = true;
      $('#vlib').onclick = renderLibrary;
      return;
    }
    $('#vocabBadge').textContent = r.items.length; $('#vocabBadge').hidden = false;
    // shuffle
    const items = r.items.slice().sort(()=>Math.random()-.5);
    let i = 0, flipped = false, lastAction = null;
    function showCard(){
      if (i >= items.length){
        vEl.innerHTML = `<div class="me-empty">🎉 จบรอบทบทวนแล้ว!<br>
          <small><a href="javascript:void(0)" onclick="location.reload()">โหลดใหม่</a> ·
          <a href="javascript:void(0)" id="vlib2">📖 คลังศัพท์</a></small></div>`;
        $('#vlib2').onclick = renderLibrary;
        unbindKb();
        return;
      }
      const v = items[i]; flipped = false;
      vEl.innerHTML = `
        <div class="flashcard-progress">การ์ด ${i+1} / ${items.length} · กล่อง ${v.box}
          ${lastAction?` · <a href="javascript:void(0)" id="fundo">↶ ยกเลิก</a>`:''}</div>
        <div class="flashcard" id="fcard">
          <button class="flashcard__tts" id="ftts" title="ฟังเสียง" aria-label="ฟัง">🔊</button>
          <div class="flashcard__front vn">${esc(v.vi)}</div>
          <div class="flashcard__back" hidden>
            ${v.ph?`<div class="flashcard__ph">${esc(v.ph)}</div>`:''}
            <div>${esc(v.th)}</div>
          </div>
          <div class="flashcard__hint">คลิกหรือกด <kbd>Space</kbd> เพื่อดูคำแปล</div>
        </div>
        <div class="flashcard__actions" id="fact" hidden>
          <button class="btn btn--ghost" id="fwrong">✗ ยังไม่จำ <small>(1)</small></button>
          <button class="btn btn--primary" id="fright">✓ จำได้ <small>(2)</small></button>
        </div>
        <div style="text-align:center;margin-top:10px;font-size:.85em"><a href="javascript:void(0)" id="fdel" class="muted">🗑 ลบคำนี้</a></div>`;
      const flip = () => {
        if (flipped) return;
        flipped = true;
        $('#fcard').querySelector('.flashcard__back').hidden = false;
        $('#fcard').querySelector('.flashcard__hint').textContent = 'จำได้มั้ย? (1=ลืม / 2=จำได้)';
        $('#fact').hidden = false;
        speak(v.vi);
      };
      $('#fcard').onclick = e => { if (!e.target.closest('.flashcard__tts')) flip(); };
      $('#ftts').onclick = e => { e.stopPropagation(); speak(v.vi); };
      const review = async ok => {
        lastAction = {vi:v.vi, prevBox:v.box};
        await window.YP_API.vocabReview(v.vi, ok);
        i++; showCard();
      };
      $('#fright').onclick = () => review(true);
      $('#fwrong').onclick = () => review(false);
      $('#fdel').onclick = async () => {
        if (!confirm('ลบ "'+v.vi+'" ออกจากคลัง?')) return;
        await window.YP_API.vocabDelete(v.vi); i++; showCard();
      };
      const undo = $('#fundo'); if (undo) undo.onclick = async () => {
        // best-effort: re-review with opposite to roll back box, then re-show
        // simpler: just refresh
        location.reload();
      };
    }
    kbHandler = e => {
      if (e.target.matches('input,textarea')) return;
      if (e.code === 'Space'){ e.preventDefault(); if (!flipped) $('#fcard')?.click(); }
      else if (flipped && e.key === '1') $('#fwrong')?.click();
      else if (flipped && e.key === '2') $('#fright')?.click();
    };
    document.addEventListener('keydown', kbHandler);
    showCard();
  }

  async function renderLibrary(){
    unbindKb();
    vEl.innerHTML = '<div class="me-empty"><span class="yp-spinner"></span> โหลด…</div>';
    const r = await window.YP_API.vocabList();
    if (!r.ok){ vEl.innerHTML = '<div class="me-empty">โหลดไม่สำเร็จ</div>'; return; }
    const s = r.stats;
    const boxes = s.byBox.map((n,i) => `<span class="vbox vbox--${i}">กล่อง ${i}: <b>${n}</b></span>`).join('');
    const rows = r.items.slice().sort((a,b)=>a.box-b.box).map(v => `
      <div class="vlib-row" data-vi="${esc(v.vi)}">
        <span class="vlib-box vbox--${v.box}">${v.box}</span>
        <div class="vlib-text">
          <strong class="vn">${esc(v.vi)}</strong>
          ${v.ph?`<span class="muted"> · ${esc(v.ph)}</span>`:''}
          <div class="muted" style="font-size:.85em">${esc(v.th)}</div>
        </div>
        <button class="vlib-tts" title="ฟัง" aria-label="ฟัง">🔊</button>
        <button class="vlib-del" title="ลบ" aria-label="ลบ">🗑</button>
      </div>`).join('');
    vEl.innerHTML = `
      <div class="vstats">
        <strong>📦 ${s.total} คำ</strong> · ⏰ ${s.due} ถึงกำหนด
        <div class="vstats__boxes">${boxes}</div>
      </div>
      <div style="margin:10px 0;text-align:center"><button class="btn btn--ghost" id="vback">← กลับไปทบทวน</button></div>
      <div class="vlib">${rows || '<div class="me-empty">ยังไม่มีคำในคลัง</div>'}</div>`;
    $('#vback').onclick = renderVocab;
    vEl.querySelectorAll('.vlib-tts').forEach(b => b.onclick = () => {
      speak(b.closest('.vlib-row').dataset.vi);
    });
    vEl.querySelectorAll('.vlib-del').forEach(b => b.onclick = async () => {
      const row = b.closest('.vlib-row');
      if (!confirm('ลบ "'+row.dataset.vi+'"?')) return;
      const r2 = await window.YP_API.vocabDelete(row.dataset.vi);
      if (r2.ok) row.remove();
    });
  }
  await renderVocab();

  // Leaderboard
  const lbEl = $('#tab-leaderboard');
  let lbLoaded = false;
  async function renderLB(){
    if (lbLoaded) return; lbLoaded = true;
    const r = await window.YP_API.leaderboard(30);
    if (!r.ok || !r.leaderboard.length){
      lbEl.innerHTML = '<div class="me-empty">ยังไม่มีคะแนน<br><small>ลองทำ quiz จบบทความเพื่อสะสมคะแนน</small></div>';
      return;
    }
    lbEl.innerHTML = `<p class="muted" style="text-align:center">🏆 30 วันล่าสุด</p>` +
      r.leaderboard.map((x,i) => `
        <div class="me-card" style="display:flex;align-items:center;gap:12px">
          <strong style="font-size:1.3rem;color:var(--brand);width:30px">${i+1}</strong>
          <img src="${x.avatar||'assets/img/favicon.svg'}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='assets/img/favicon.svg'" style="width:40px;height:40px;border-radius:50%;object-fit:cover">
          <div style="flex:1"><strong>${x.name||'(ไม่ระบุ)'}</strong><div class="meta">${x.attempts} quizzes</div></div>
          <strong style="color:var(--brand);font-size:1.2rem">${x.points} pts</strong>
        </div>`).join('');
  }
  // bind tab switch (override default to call renderLB)
  document.querySelectorAll('.me-tab').forEach(t => t.addEventListener('click', () => {
    if (t.dataset.tab === 'leaderboard') renderLB();
  }));

  $('#logoutBtn').onclick = async () => {
    await window.YP_AUTH.logout();
    localStorage.removeItem('yp:isAdmin');
    location.href = 'index.html';
  };
})();
</script>
</body>
</html>
