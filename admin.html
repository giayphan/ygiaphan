<style>
  :root{
    --ad-bg:#f6fbf3; --ad-card:#fff; --ad-fg:#234231; --ad-muted:#6b8077;
    --ad-line:#dceadb; --ad-brand:#2d8a4e; --ad-brand-dim:#4caf6f;
    --ad-brand-soft:#e8f5dd; --ad-danger:#c0392b; --ad-warn:#d39e00;
  }
  body{background:var(--ad-bg);color:var(--ad-fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .ad{max-width:1100px;margin:0 auto;padding:24px 16px}
  .ad h1{margin:0 0 12px;color:var(--ad-brand);font-weight:700;font-size:1.6rem}
  .ad .topbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;
    background:var(--ad-card);padding:12px;border-radius:12px;border:1px solid var(--ad-line)}
  .ad .topbar input{width:auto;flex:1;min-width:200px}
  .ad input,.ad textarea,.ad select{
    width:100%;box-sizing:border-box;
    padding:9px 12px;border:1px solid var(--ad-line);border-radius:8px;font:inherit;
    background:#fff;color:var(--ad-fg);transition:border .15s,box-shadow .15s
  }
  .ad .row > div{display:flex;flex-direction:column;gap:4px}
  .ad form > div > label{display:block}
  .ad input:focus,.ad textarea:focus,.ad select:focus{
    outline:none;border-color:var(--ad-brand);box-shadow:0 0 0 3px var(--ad-brand-soft)
  }
  .ad textarea{min-height:160px;font-family:ui-monospace,Menlo,Consolas,monospace;width:100%}
  .ad .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 16px;border:none;border-radius:8px;cursor:pointer;
    font-weight:600;font-size:.93rem;transition:all .15s;
    background:var(--ad-brand);color:#fff
  }
  .ad .btn:hover{background:#236d3e;transform:translateY(-1px);box-shadow:0 4px 12px rgba(45,138,78,.3)}
  .ad .btn:active{transform:translateY(0)}
  .ad .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .ad .btn--ghost{background:#fff;color:var(--ad-brand);border:1px solid var(--ad-brand)}
  .ad .btn--ghost:hover{background:var(--ad-brand-soft)}
  .ad .btn--danger{background:var(--ad-danger)} .ad .btn--danger:hover{background:#a03020}
  .ad .btn--warn{background:var(--ad-warn);color:#fff} .ad .btn--warn:hover{background:#b88600}
  .ad .btn--sm{padding:6px 10px;font-size:.85rem}
  .ad .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid var(--ad-line)}
  .ad .tabs button{
    background:none;border:none;padding:10px 16px;cursor:pointer;
    color:var(--ad-muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px;
    transition:all .15s
  }
  .ad .tabs button:hover{color:var(--ad-brand)}
  .ad .tabs button.is-active{color:var(--ad-brand);border-bottom-color:var(--ad-brand)}
  .ad .panel{display:none} .ad .panel.is-active{display:block}
  .ad .card{background:var(--ad-card);border:1px solid var(--ad-line);border-radius:12px;padding:16px;margin-bottom:12px}
  .ad form{display:grid;gap:10px}
  .ad .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:600px){.ad .row{grid-template-columns:1fr}}
  .ad label{font-size:.85rem;color:var(--ad-muted);font-weight:600}
  .ad .checkbox{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .ad .checkbox input{width:18px;height:18px;accent-color:var(--ad-brand)}
  .ad .item{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:10px 12px;border:1px solid var(--ad-line);border-radius:8px;margin-bottom:6px;background:#fff}
  .ad .item:hover{border-color:var(--ad-brand-dim);background:var(--ad-brand-soft)}
  .ad .muted{color:var(--ad-muted);font-size:.85em}
  .ad .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.75rem;font-weight:600;background:var(--ad-brand-soft);color:var(--ad-brand)}
  .ad .pill--warn{background:#fff3cd;color:#856404} .ad .pill--danger{background:#fde2e0;color:#a03020}
  .ad .pill--ok{background:#d4edda;color:#155724}
  .ad .status{color:var(--ad-muted);font-size:.9em;display:inline-flex;gap:6px;align-items:center}
  .ad-badge{background:var(--ad-danger);color:#fff;font-size:.7rem;padding:1px 7px;border-radius:99px;margin-left:4px;font-weight:700}
  .ad-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
  .ad-stat{background:var(--ad-card);border:1px solid var(--ad-line);border-radius:12px;padding:14px;text-align:left}
  .ad-stat__label{color:var(--ad-muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .ad-stat__val{font-size:1.7rem;font-weight:700;color:var(--ad-brand);margin:4px 0 0;line-height:1}
  .ad-stat__sub{color:var(--ad-muted);font-size:.78rem;margin-top:2px}
  .ad-chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:8px 0}
  .ad-chart__bar{flex:1;background:var(--ad-brand-dim);border-radius:4px 4px 0 0;position:relative;min-height:2px;transition:background .15s}
  .ad-chart__bar:hover{background:var(--ad-brand)}
  .ad-chart__bar::after{content:attr(data-v);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--ad-muted);margin-bottom:2px}
  .ad-chart__bar::before{content:attr(data-d);position:absolute;top:100%;left:50%;transform:translateX(-50%) rotate(-60deg);transform-origin:left top;font-size:.65rem;color:var(--ad-muted);margin-top:4px;white-space:nowrap}
  .ad-recent{font-size:.88rem;line-height:1.5}
  .ad-recent__row{padding:6px 0;border-bottom:1px dashed var(--ad-line)}
  .ad-recent__row:last-child{border:0}
  .ad-recent__time{color:var(--ad-muted);font-size:.78rem;margin-left:6px}
  @media(max-width:700px){ .ad .row{grid-template-columns:1fr !important} }
  .ad .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

  /* Login screen */
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh;padding:20px}
  .login-card{background:#fff;border-radius:20px;padding:36px 32px;max-width:420px;width:100%;
    box-shadow:0 8px 32px rgba(45,138,78,.15);border:1px solid var(--ad-line)}
  .login-hero{text-align:center;margin-bottom:24px}
  .login-hero__icon{font-size:48px;line-height:1;margin-bottom:8px}
  .login-hero h2{margin:0 0 4px;color:var(--ad-brand);font-size:1.5rem}
  .login-hero .muted{font-size:.9em;margin:0}
  .login-google{display:flex;justify-content:center;margin-bottom:18px;min-height:44px}
  .login-divider{position:relative;text-align:center;margin:18px 0;color:var(--ad-muted);font-size:.82em}
  .login-divider::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ad-line);z-index:0}
  .login-divider span{background:#fff;padding:0 12px;position:relative;z-index:1}
  .login-form{display:grid;gap:10px}
  .login-form input{padding:12px 14px;border:1.5px solid var(--ad-line);border-radius:10px;font:inherit;background:#fff;transition:border-color .15s}
  .login-form input:focus{outline:none;border-color:var(--ad-brand);box-shadow:0 0 0 3px var(--ad-brand-soft)}
  .login-otp{text-align:center !important;letter-spacing:8px;font-size:1.2rem;font-weight:700}
  .login-form .btn{padding:12px;font-size:1rem;border-radius:10px;font-weight:600;margin-top:4px;display:flex;align-items:center;justify-content:center;text-align:center;width:100%;gap:6px}
  .login-hint{margin:6px 0 0;font-size:.82em;text-align:center}
  .login-card .status{display:block;text-align:center;margin-top:12px;padding:8px 12px;border-radius:8px;font-size:.9em;justify-content:center}
  .login-card .status:not(:empty){background:var(--ad-brand-soft)}
</style>

<script src="content/config.js"></script>

<script>
const cfg = window.YP_CONFIG||{};
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const f = $('#p-form'), status = $('#status');
const TOKEN_LS = 'yp:adminToken';
const FP_LS = 'yp:adminFp';
let DATA = null;
let tokenExpAt = 0, expInterval;

// fingerprint: stable per browser+UA — ผูก session กับ device นี้
function getFp(){
  let fp = sessionStorage.getItem(FP_LS);
  if (!fp){
    const seed = navigator.userAgent + '|' + navigator.language + '|' + screen.width + 'x' + screen.height;
    let h = 0; for (let i=0;i<seed.length;i++){ h = ((h<<5)-h+seed.charCodeAt(i))|0; }
    fp = 'fp_'+Math.abs(h).toString(36)+'_'+Math.random().toString(36).slice(2,10);
    sessionStorage.setItem(FP_LS, fp);
  }
  return fp;
}

const busy = on => { $('#overlay').hidden = !on; };
const postRaw = (body) => fetch(cfg.API_URL, {
  method:'POST',
  headers:{'Content-Type':'text/plain;charset=utf-8'},
  body: JSON.stringify(body)
});
const post = async (body) => {
  body.admin_token = sessionStorage.getItem(TOKEN_LS) || '';
  body.fp = getFp();
  return (await postRaw(body)).json();
};
const setStatus = (msg, cls='') => { status.innerHTML = msg ? (cls==='spin'?`<span class="yp-spinner"></span> ${msg}`:msg) : ''; };
const escapeHtml = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyVal = () => ($('#key').value || '').trim();

/* ===== Login flow ===== */
function show(el, on){ el.hidden = !on; el.style.display = on ? '' : 'none'; }
function showLogin(msg){
  show($('#loginBox'), true);
  show($('#topbar'), false);
  show($('#adminBody'), false);
  $('#otpField').hidden = true; $('#otpField').value='';
  $('#key').value=''; $('#loginBtn').textContent='ส่ง OTP';
  $('#loginHint').textContent = msg || 'OTP จะถูกส่งไปยัง admin email';
  if (expInterval) clearInterval(expInterval);
}
function showAdmin(){
  show($('#loginBox'), false);
  show($('#topbar'), true);
  show($('#adminBody'), true);
  loadAll();
  loadDashboard();
  startExpTimer();
}

async function loadDashboard(){
  try {
    const r = await post({action:'admin_stats'});
    if (!r.ok) return;
    const s = r.stats;
    // stat cards
    const cards = [
      {label:'Users', val:s.users_total, sub:`+${s.users_7d} this week`},
      {label:'Comments', val:s.comments_total, sub:s.comments_pending?`⚠ ${s.comments_pending} pending`:'all approved'},
      {label:'Orders', val:s.orders_total, sub:`${s.orders_paid} paid · ${s.orders_pending} pending`},
      {label:'Revenue', val:s.revenue_paid.toLocaleString(), sub:'THB (paid)'},
      {label:'Posts', val:s.posts_published, sub:`${s.posts_total} total`}
    ];
    $('#d-stats').innerHTML = cards.map(c => `
      <div class="ad-stat">
        <div class="ad-stat__label">${c.label}</div>
        <div class="ad-stat__val">${c.val}</div>
        <div class="ad-stat__sub">${c.sub}</div>
      </div>`).join('');

    // chart
    const max = Math.max(1, ...r.chart.map(x=>x.count));
    $('#d-chart').innerHTML = r.chart.map(x => {
      const h = (x.count/max*100).toFixed(0);
      const dd = x.date.slice(5); // MM-DD
      return `<div class="ad-chart__bar" style="height:${h}%" data-v="${x.count||''}" data-d="${dd}"></div>`;
    }).join('');

    // top posts
    $('#d-top').innerHTML = r.top_posts.length
      ? r.top_posts.map(p => `<div class="item"><a href="post.html?slug=${encodeURIComponent(p.slug)}" target="_blank">${p.title}</a><span class="pill">💬 ${p.comments}</span></div>`).join('')
      : '<p class="muted">ยังไม่มีคอมเมนต์</p>';

    // recent activity
    $('#d-recent').innerHTML = r.recent.length
      ? `<div class="ad-recent">${r.recent.map(x => `<div class="ad-recent__row">${x.label}<span class="ad-recent__time">${timeAgo(x.ts)}</span></div>`).join('')}</div>`
      : '<p class="muted">ไม่มีกิจกรรม</p>';

    // pending comments badge
    if (s.comments_pending){
      $('#cmtBadge').textContent = s.comments_pending; $('#cmtBadge').hidden = false;
    } else { $('#cmtBadge').hidden = true; }

    // pending list
    const pr = await post({action:'admin_pending'});
    if (pr.ok){
      $('#d-pending').innerHTML = pr.comments.length
        ? pr.comments.map(c => `<div class="item">
            <div><strong>${escapeHtml(c.name)}</strong> on <em>${c.slug}</em><br><small class="muted">${escapeHtml(c.msg).slice(0,100)}</small></div>
            <button class="btn btn--sm" data-approve="${c.ts}" data-slug="${c.slug}">✓ Approve</button>
          </div>`).join('')
        : '<p class="muted">✓ ไม่มี comment ที่รออนุมัติ</p>';
      $('#d-pending').querySelectorAll('[data-approve]').forEach(btn => btn.onclick = async () => {
        btn.disabled = true; btn.textContent = '...';
        const r = await post({action:'admin_approve', ts: btn.dataset.approve, slug: btn.dataset.slug});
        if (r.ok) loadDashboard();
        else { btn.disabled = false; btn.textContent = '✗ '+r.error; }
      });
    }
  } catch(e){ console.error('dashboard load failed', e); }
}

function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if (s<60) return s+'s ago';
  if (s<3600) return Math.floor(s/60)+'m ago';
  if (s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function startExpTimer(){
  if (expInterval) clearInterval(expInterval);
  expInterval = setInterval(() => {
    const sec = Math.max(0, Math.floor((tokenExpAt - Date.now())/1000));
    const m = Math.floor(sec/60), s = sec%60;
    $('#expTimer').textContent = sec ? `⏱ ${m}:${String(s).padStart(2,'0')}` : '';
    if (sec <= 0){
      sessionStorage.removeItem(TOKEN_LS); localStorage.removeItem('yp:isAdmin');
      showLogin('Session หมดอายุ — กรุณา login ใหม่');
    }
  }, 1000);
}

// Google Sign-In (admin only)
(function initGoogleAdmin(){
  const cid = (window.YP_CONFIG||{}).GOOGLE_CLIENT_ID;
  if (!cid) { document.getElementById('gAdminBtn').innerHTML='<small class="muted">⚠ ตั้ง GOOGLE_CLIENT_ID ใน config.js</small>'; return; }
  function tryInit(){
    if (typeof google === 'undefined' || !google.accounts) { setTimeout(tryInit, 200); return; }
    google.accounts.id.initialize({
      client_id: cid,
      callback: async (resp) => {
        setStatus('กำลังตรวจสอบ...');
        busy(true);
        try {
          const r = await post({action:'admin_google', id_token: resp.credential});
          if (r.error){ setStatus('✗ ' + r.error + ' (ใช้เฉพาะ admin email)'); return; }
          if (r.ok && r.admin_token){
            sessionStorage.setItem(TOKEN_LS, r.admin_token); localStorage.setItem('yp:isAdmin','1');
            tokenExpAt = Date.now() + r.expires_in*1000;
            showAdmin();
          }
        } finally { busy(false); }
      }
    });
    google.accounts.id.renderButton(document.getElementById('gAdminBtn'),
      {theme:'outline', size:'large', text:'signin_with', width:320});
  }
  tryInit();
})();

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const otpVisible = !$('#otpField').hidden;
  busy(true);
  try {
    let r;
    if (!otpVisible){
      r = await post({action:'admin_login', key: keyVal()});
      if (r.error){ setStatus('✗ ' + r.error); return; }
      if (r.need_otp){
        $('#otpField').hidden = false; $('#otpField').focus();
        $('#loginBtn').textContent = 'ยืนยัน OTP';
        $('#loginHint').textContent = '✓ ส่ง OTP ไป admin email แล้ว';
        setStatus('กรอก OTP จาก email');
        return;
      }
      if (r.ok && r.admin_token){
        sessionStorage.setItem(TOKEN_LS, r.admin_token); localStorage.setItem('yp:isAdmin','1');
        tokenExpAt = Date.now() + r.expires_in*1000;
        showAdmin();
      }
    } else {
      r = await post({action:'admin_login_otp', key: keyVal(), otp: $('#otpField').value.trim()});
      if (r.error){ setStatus('✗ ' + r.error); return; }
      if (r.ok && r.admin_token){
        sessionStorage.setItem(TOKEN_LS, r.admin_token); localStorage.setItem('yp:isAdmin','1');
        tokenExpAt = Date.now() + r.expires_in*1000;
        showAdmin();
      }
    }
  } finally { busy(false); }
});

$('#logout').onclick = async () => {
  await post({action:'admin_logout'}).catch(()=>{});
  sessionStorage.removeItem(TOKEN_LS); localStorage.removeItem('yp:isAdmin');
  showLogin('ออกแล้ว');
};

// auto-logout เมื่อ tab close / unload
window.addEventListener('beforeunload', () => {
  // ไม่ลบ token ที่ server เพื่อให้ refresh tab ยังใช้ได้ แต่ clear ถ้า tab ปิด
});
// auto-logout เมื่อ idle เกิน 15 นาที
let idleTimer;
const resetIdle = () => {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    sessionStorage.removeItem(TOKEN_LS); localStorage.removeItem('yp:isAdmin');
    showLogin('Idle เกินกำหนด — กรุณา login ใหม่');
  }, 15*60*1000);
};
['mousemove','keydown','click','scroll'].forEach(e => document.addEventListener(e, resetIdle, {passive:true}));
resetIdle();

// tabs
$$('.tabs button').forEach(btn => btn.onclick = () => {
  $$('.tabs button').forEach(b => b.classList.toggle('is-active', b===btn));
  $$('.panel').forEach(p => p.classList.toggle('is-active', p.dataset.panel===btn.dataset.tab));
  if (btn.dataset.tab === 'dashboard') loadDashboard();
});
$('#d-reload')?.addEventListener('click', loadDashboard);

/* ===== Load all ===== */
async function loadAll(){
  if (!cfg.API_URL) return setStatus('ตั้ง API_URL ก่อน', 'err');
  setStatus('loading…', 'spin'); busy(true);
  try {
    DATA = await post({action:'admin_listall'});
    if (DATA.error){
      if (DATA.error === 'unauthorized' || /lock|session/i.test(DATA.error)){
        sessionStorage.removeItem(TOKEN_LS); localStorage.removeItem('yp:isAdmin');
        showLogin('Session หมดอายุ — login ใหม่');
        return;
      }
      setStatus('error: '+DATA.error); return;
    }
    renderPosts(); renderComments(); renderOrders(); renderUsers(); renderDonations();
    setStatus(`${DATA.posts.length} posts · ${DATA.comments.length} comments · ${DATA.orders.length} orders`);
  } catch(e){ setStatus('network error'); }
  finally { busy(false); }
}
$('#p-reload').onclick = loadAll;
$('#c-reload').onclick = loadAll;
$('#o-reload').onclick = loadAll;
$('#u-reload').onclick = loadAll;
$('#d-reload').onclick = loadAll;

/* ===== Posts ===== */
function setForm(p){
  p = p || {date:new Date().toISOString().slice(0,10), published:true, members_only:false};
  for (const el of f.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') {
      const v = p[el.name];
      el.checked = v === true || (v !== false && String(v).toLowerCase() !== 'false' && el.name === 'published');
      if (el.name === 'members_only') el.checked = v === true || String(v).toLowerCase() === 'true';
    } else el.value = Array.isArray(p[el.name]) ? p[el.name].join(',') : (p[el.name] ?? '');
  }
}
function getForm(){
  const o = {};
  for (const el of f.elements) {
    if (!el.name) continue;
    o[el.name] = el.type === 'checkbox' ? el.checked : el.value;
  }
  o.categories = String(o.categories||'').split(',').map(s=>s.trim()).filter(Boolean);
  return o;
}
function renderPosts(){
  $('#p-list').innerHTML = (DATA.posts||[]).map(p => {
    const pub = p.published === true || String(p.published).toLowerCase() !== 'false';
    const mem = p.members_only === true || String(p.members_only).toLowerCase() === 'true';
    return `<div class="item yp-fade-in">
      <div>
        <strong>${escapeHtml(p.slug)}</strong>
        ${pub ? '<span class="pill pill--ok">published</span>' : '<span class="pill pill--warn">hidden</span>'}
        ${mem ? '<span class="pill">members</span>' : ''}
        <br><span class="muted">${p.date} · ${escapeHtml(p.categories||'')} · ${escapeHtml(p.title_vi||'')}</span>
      </div>
      <button class="btn btn--sm btn--ghost" data-edit='${encodeURIComponent(JSON.stringify(p))}'>✏️ Edit</button>
    </div>`;
  }).join('');
}
$('#p-list').addEventListener('click', e => {
  const b = e.target.closest('[data-edit]');
  if (!b) return;
  setForm(JSON.parse(decodeURIComponent(b.dataset.edit)));
  scrollTo({top:0,behavior:'smooth'});
});
$('#p-new').onclick = () => setForm();
f.addEventListener('submit', async e => {
  e.preventDefault();
  busy(true);
  try {
    const r = await post({action:'post', ...getForm()});
    setStatus(r.error ? 'error: '+r.error : 'saved: '+r.slug);
    if (r.ok) await loadAll();
  } finally { busy(false); }
});
$('#p-del').onclick = async () => {
  const slug = f.slug.value.trim();
  if (!slug || !confirm('Delete '+slug+'?')) return;
  busy(true);
  try {
    const r = await post({action:'delete', slug});
    setStatus(r.error ? 'error: '+r.error : 'deleted');
    if (r.ok){ setForm(); await loadAll(); }
  } finally { busy(false); }
};

/* ===== Comments ===== */
function renderComments(){
  $('#c-list').innerHTML = (DATA.comments||[]).map(c => `
    <div class="item yp-fade-in">
      <div>
        <strong>${escapeHtml(c.name)}</strong>
        ${c.user_email ? `<span class="pill">✉️ ${escapeHtml(c.user_email)}</span>` : '<span class="pill pill--warn">guest</span>'}
        on <em>${escapeHtml(c.slug)}</em>
        ${String(c.approved).toLowerCase()==='false' ? '<span class="pill pill--warn">รออนุมัติ</span>' : '<span class="pill pill--ok">ok</span>'}
        <br><span class="muted">${new Date(+c.ts).toLocaleString()}</span>
        <div style="margin-top:4px">${escapeHtml(c.msg)}</div>
      </div>
      <div style="display:flex;gap:4px;flex-direction:column">
        ${String(c.approved).toLowerCase()==='false' ? `<button class="btn btn--sm" data-approve="${c.ts}">✓</button>` : ''}
        <button class="btn btn--sm btn--danger" data-delc='${c.ts}|${escapeHtml(c.slug)}'>🗑</button>
      </div>
    </div>`).join('') || '<p class="muted">ไม่มี comment</p>';
}
$('#c-list').addEventListener('click', async e => {
  const ap = e.target.closest('[data-approve]');
  const dl = e.target.closest('[data-delc]');
  busy(true);
  try {
    if (ap){
      const j = await post({action:'admin_approve', ts:+ap.dataset.approve, approved:true});
      if(j.ok) await loadAll();
    } else if (dl){
      if (!confirm('ลบ comment นี้?')) return;
      const [ts, slug] = dl.dataset.delc.split('|');
      const j = await post({action:'admin_delcomment', ts:+ts, slug});
      if(j.ok) await loadAll();
    }
  } finally { busy(false); }
});

/* ===== Orders ===== */
function renderOrders(){
  $('#o-list').innerHTML = (DATA.orders||[]).map(o => {
    const stCls = o.status==='paid'?'pill--ok':o.status==='awaiting_review'?'pill--warn':'pill';
    return `<div class="item yp-fade-in">
      <div>
        <strong>${escapeHtml(o.item_title||o.item_id)}</strong> — ${o.amount} ${o.currency||'THB'}
        <span class="pill ${stCls}">${o.status}</span>
        <br><span class="muted">${escapeHtml(o.email)} · ${new Date(+o.created_at).toLocaleString()}</span>
        ${o.slip_url ? `<br><a href="${escapeHtml(o.slip_url)}" target="_blank" class="muted">📎 ดูสลิป</a>` : ''}
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap">
        ${o.status!=='paid' ? `<button class="btn btn--sm" data-paid="${o.order_id}">✓ ยืนยันจ่าย</button>` : ''}
        ${o.status!=='cancelled' ? `<button class="btn btn--sm btn--warn" data-cancel="${o.order_id}">✗ ยกเลิก</button>` : ''}
      </div>
    </div>`;
  }).join('') || '<p class="muted">ยังไม่มี order</p>';
}
$('#o-list').addEventListener('click', async e => {
  const paid = e.target.closest('[data-paid]');
  const cancel = e.target.closest('[data-cancel]');
  if (!paid && !cancel) return;
  const order_id = (paid||cancel).dataset.paid || (paid||cancel).dataset.cancel;
  const status = paid ? 'paid' : 'cancelled';
  if (!confirm(`เปลี่ยนสถานะเป็น ${status}?`)) return;
  busy(true);
  try {
    const j = await post({action:'order_status', order_id, status});
    if(j.ok) await loadAll();
    else setStatus('error: '+j.error);
  } finally { busy(false); }
});

/* ===== Users ===== */
function renderUsers(){
  $('#u-list').innerHTML = (DATA.users||[]).map(u => `
    <div class="item yp-fade-in">
      <div>
        ${u.avatar ? `<img src="${escapeHtml(u.avatar)}" style="width:32px;height:32px;border-radius:50%;vertical-align:middle">` : ''}
        <strong>${escapeHtml(u.name||u.email)}</strong>
        <span class="pill">${escapeHtml(u.provider)}</span>
        <br><span class="muted">${escapeHtml(u.email)} · สมัคร ${new Date(+u.created_at).toLocaleDateString()}</span>
      </div>
    </div>`).join('') || '<p class="muted">ยังไม่มีสมาชิก</p>';
}

/* ===== Donations ===== */
function renderDonations(){
  const total = (DATA.donations||[]).reduce((s,d)=>s+(+d.amount||0),0);
  $('#d-list').innerHTML = `<div class="card"><strong>รวมทั้งหมด:</strong> ${total.toLocaleString()} THB</div>` +
    (DATA.donations||[]).map(d => `
    <div class="item yp-fade-in">
      <div>
        <strong>${escapeHtml(d.name||'ไม่ระบุ')}</strong> — ${(+d.amount).toLocaleString()} THB
        <span class="pill">${escapeHtml(d.channel)}</span>
        <br><span class="muted">${new Date(+d.ts).toLocaleString()} · ${escapeHtml(d.note||'')}</span>
      </div>
    </div>`).join('');
}

// init — เช็คว่ามี token อยู่แล้วไหม
async function init(){
  setForm();
  const tk = sessionStorage.getItem(TOKEN_LS);
  if (!tk){ showLogin(); return; }
  // validate token
  const r = await post({action:'admin_check'});
  if (r.ok){
    tokenExpAt = Date.now() + 60*60*1000; // approximate, server จะคืน expires_in ตอน login เท่านั้น
    showAdmin();
  } else {
    sessionStorage.removeItem(TOKEN_LS); localStorage.removeItem('yp:isAdmin');
    showLogin();
  }
}
init();
</script>
