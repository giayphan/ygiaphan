<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · ygiaphan</title>
<link rel="stylesheet" href="assets/css/main.css">
<style>
  .admin{max-width:860px;margin:24px auto;padding:0 16px}
  .admin form{display:grid;gap:10px}
  .admin input,.admin textarea,.admin select{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font:inherit}
  .admin textarea{min-height:160px;font-family:ui-monospace,monospace}
  .admin .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .admin .bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .admin .list{margin-top:24px}
  .admin .item{display:flex;justify-content:space-between;gap:8px;padding:8px;border-bottom:1px solid #eee}
  .admin .muted{color:#888;font-size:.9em}
</style>
</head>
<body>
<main class="admin">
  <h1>Admin</h1>
  <div class="bar">
    <input id="key" type="password" placeholder="Admin key" style="max-width:240px">
    <button id="load">Load</button>
    <button id="new">+ New</button>
    <span id="status" class="muted"></span>
  </div>

  <form id="f">
    <div class="row">
      <input name="slug" placeholder="slug (เช่น greetings)" required>
      <input name="date" type="date" required>
    </div>
    <div class="row">
      <input name="categories" placeholder="categories (คั่นด้วย ,)">
      <input name="icon" placeholder="icon emoji">
    </div>
    <div class="row">
      <input name="cover" placeholder="cover URL (optional)">
      <input name="video" placeholder="video embed URL (optional)">
    </div>
    <div class="row">
      <input name="title_vi" placeholder="title (vi)" required>
      <input name="title_th" placeholder="title (th)" required>
    </div>
    <div class="row">
      <input name="desc_vi" placeholder="desc (vi)">
      <input name="desc_th" placeholder="desc (th)">
    </div>
    <textarea name="body_vi" placeholder="body markdown (vi)"></textarea>
    <textarea name="body_th" placeholder="body markdown (th)"></textarea>
    <label><input type="checkbox" name="published" checked> published</label>
    <div class="bar">
      <button type="submit">Save</button>
      <button type="button" id="del" style="color:#c33">Delete</button>
    </div>
  </form>

  <div class="list" id="list"></div>
</main>

<script src="content/config.js"></script>
<script src="assets/js/api.js"></script>
<script>
const cfg = window.YP_CONFIG||{};
const $ = s => document.querySelector(s);
const f = $('#f'), status = $('#status');
const keyLS = 'yp:adminKey';
$('#key').value = localStorage.getItem(keyLS) || '';
$('#key').addEventListener('change', e => localStorage.setItem(keyLS, e.target.value));

function setForm(p){
  p = p || {date:new Date().toISOString().slice(0,10), published:true};
  for (const el of f.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') el.checked = p[el.name] !== false && p[el.name] !== 'false';
    else el.value = Array.isArray(p[el.name]) ? p[el.name].join(',') : (p[el.name] ?? '');
  }
}
function getForm(){
  const o = {};
  for (const el of f.elements) {
    if (!el.name) continue;
    o[el.name] = el.type === 'checkbox' ? el.checked : el.value;
  }
  o.categories = String(o.categories||'').split(',').map(s=>s.trim()).filter(Boolean);
  return o;
}

async function load(){
  if (!cfg.API_URL) return status.textContent = 'ตั้ง API_URL ใน content/config.js ก่อน';
  status.textContent = 'loading…';
  const r = await fetch(cfg.API_URL + '?action=posts');
  const list = await r.json();
  $('#list').innerHTML = list.map(p => `
    <div class="item">
      <div><strong>${p.slug}</strong> <span class="muted">${p.date} · ${(p.categories||[]).join(', ')}</span><br>
        <span class="muted">${p.title_vi||''} / ${p.title_th||''}</span></div>
      <button data-edit='${encodeURIComponent(JSON.stringify(p))}'>Edit</button>
    </div>`).join('');
  status.textContent = list.length + ' posts';
}
$('#list').addEventListener('click', e => {
  const b = e.target.closest('[data-edit]');
  if (!b) return;
  setForm(JSON.parse(decodeURIComponent(b.dataset.edit)));
  scrollTo({top:0,behavior:'smooth'});
});
$('#load').onclick = load;
$('#new').onclick  = () => setForm();

f.addEventListener('submit', async e => {
  e.preventDefault();
  const key = $('#key').value.trim();
  if (!key) return status.textContent = 'ใส่ admin key';
  const r = await window.YP_API.upsertPost(key, getForm());
  status.textContent = r.error ? ('error: '+r.error) : ('saved: '+r.slug);
  if (r.ok) load();
});
$('#del').onclick = async () => {
  const slug = f.slug.value.trim();
  if (!slug || !confirm('Delete '+slug+'?')) return;
  const r = await window.YP_API.deletePost($('#key').value.trim(), slug);
  status.textContent = r.error ? ('error: '+r.error) : 'deleted';
  if (r.ok){ setForm(); load(); }
};

setForm();
if (cfg.API_URL) load();
</script>
</body>
</html>
