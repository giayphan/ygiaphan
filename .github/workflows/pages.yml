name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate config.js from secrets
        env:
          YP_API_URL: ${{ secrets.API_URL }}
          YP_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          YP_PROMPTPAY: ${{ secrets.PROMPTPAY }}
          YP_PAYPAL_URL: ${{ secrets.PAYPAL_URL }}
        run: |
          python3 -c "
          import os
          lines = [
            'window.YP_CONFIG = {',
            '  API_URL: \"' + os.environ['YP_API_URL'] + '\",',
            '  USE_API: true,',
            '  GOOGLE_CLIENT_ID: \"' + os.environ['YP_GOOGLE_CLIENT_ID'] + '\",',
            '  DONATE: {',
            '    promptpay: \"' + os.environ['YP_PROMPTPAY'] + '\",',
            '    promptpay_qr: \"assets/img/promptpay.png\",',
            '    paypal: \"' + os.environ['YP_PAYPAL_URL'] + '\"',
            '  }',
            '};',
          ]
          open('content/config.js', 'w').write('\n'.join(lines) + '\n')
          print(open('content/config.js').read())
          "
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
