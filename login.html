<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ · ygiaphan</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer-when-downgrade">
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/main.css?v=20260516">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  .login-wrap{max-width:420px;margin:60px auto;padding:0 16px}
  .login-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;
    box-shadow:0 4px 16px rgba(45,138,78,.12)}
  .login-card h1{margin:0 0 6px;color:var(--brand);font-size:1.4rem}
  .login-card .sub{color:var(--muted);font-size:.9rem;margin-bottom:20px}
  .login-card input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;
    font:inherit;background:#fff;color:var(--fg);margin-bottom:10px;box-sizing:border-box}
  .login-card input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
  .login-card .btn{width:100%;padding:12px;border:none;border-radius:8px;cursor:pointer;
    font-weight:600;background:var(--brand);color:#fff;font-size:1rem;transition:all .15s}
  .login-card .btn:hover{background:#236d3e}
  .login-card .btn:disabled{opacity:.5;cursor:not-allowed}
  .login-card .btn--fb{background:#1877f2;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
  .login-card .btn--fb:hover{background:#1564d4}
  .login-card .divider{text-align:center;color:var(--muted);font-size:.85rem;margin:16px 0;position:relative}
  .login-card .divider::before,.login-card .divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--line)}
  .login-card .divider::before{left:0} .login-card .divider::after{right:0}
  .login-card .divider{margin:18px 0}
  .login-card .msg{padding:10px;border-radius:8px;margin-top:12px;font-size:.9rem}
  .login-card .msg--ok{background:#d4edda;color:#155724}
  .login-card .msg--err{background:#fde2e0;color:#a03020}
  .me-card{text-align:center}
  .me-card img{width:64px;height:64px;border-radius:50%;margin-bottom:8px}
</style>
</head>
<body>
<div data-include="header"></div>

<main class="login-wrap">
  <div class="login-card" id="loadingCard" style="text-align:center">
    <span class="yp-spinner"></span> กำลังโหลด…
  </div>
  <div class="login-card" id="loginCard" hidden>
    <h1>🌿 เข้าสู่ระบบ</h1>
    <p class="sub">รับ comment, ซื้อคอร์ส, ติดตามคำสั่งซื้อของคุณ</p>

    <form id="emailForm">
      <input type="email" name="email" id="emailInput" placeholder="your@email.com" required>
      <button class="btn" type="submit" id="emailBtn">📧 ส่งรหัส OTP</button>
    </form>
    <form id="otpForm" hidden>
      <p class="sub" style="margin-bottom:8px">กรอกรหัส 6 หลักจากอีเมล <strong id="otpEmail"></strong></p>
      <input type="text" name="otp" id="otpInput" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" required
        style="text-align:center;letter-spacing:8px;font-size:1.3rem;font-weight:700">
      <button class="btn" type="submit" id="otpBtn">✓ ยืนยัน</button>
      <button class="btn" type="button" id="otpBack" style="background:#888;margin-top:6px">← เปลี่ยน email</button>
    </form>

    <div id="gDiv" hidden>
      <div class="divider">หรือ</div>
      <div id="gBtn" style="display:flex;justify-content:center"></div>
    </div>

    <div id="msg"></div>
  </div>

  <div class="login-card me-card" id="meCard" hidden>
    <img id="meAvatar" src="" alt="">
    <h1 id="meName"></h1>
    <p class="sub" id="meEmail"></p>
    <button class="btn" id="logoutBtn">ออกจากระบบ</button>
  </div>
</main>

<div data-include="footer"></div>

<script src="content/config.js"></script>
<script src="content/i18n/vi.js"></script>
<script src="content/i18n/th.js"></script>
<script src="content/site.js"></script>
<script src="content/nav.js"></script>
<script src="assets/js/pwa.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);

// 1) ถ้า redirect กลับมาพร้อม session (จาก magic link fallback) → เก็บ + redirect
if (params.get('session')){
  window.YP_AUTH.setToken(params.get('session'));
  const back = sessionStorage.getItem('yp:back') || 'me.html';
  sessionStorage.removeItem('yp:back');
  location.replace(back);
}

// ถ้ามี token + verify ผ่าน → ไป me.html (กัน loop ตอน token เสีย)
if (window.YP_AUTH.isLogin()){
  window.YP_AUTH.me().then(r => {
    if (r && r.ok) location.replace('me.html');
    else window.YP_AUTH.setToken(''); // clear bad token, แสดง form
  });
}

// 2) ถ้า login อยู่แล้ว → แสดงโปรไฟล์
async function refreshMe(){
  const hasToken = window.YP_AUTH.isLogin();
  if (!hasToken){
    $('#loadingCard').hidden = true;
    $('#loginCard').hidden = false;
    return;
  }
  const me = await window.YP_AUTH.me();
  $('#loadingCard').hidden = true;
  if (me && me.ok){
    $('#meCard').hidden = false;
    $('#meAvatar').src = me.user.avatar || 'assets/img/favicon.svg';
    $('#meName').textContent = me.user.name || me.user.email;
    $('#meEmail').textContent = me.user.email;
  } else {
    window.YP_AUTH.setToken('');
    $('#loginCard').hidden = false;
  }
}
refreshMe();

// 3) ส่ง OTP
let pendingEmail = '';
$('#emailForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#emailBtn'); btn.disabled = true; btn.innerHTML = '<span class="yp-spinner"></span> กำลังส่ง…';
  const email = $('#emailInput').value.trim();
  const r = await window.YP_AUTH.magicSend(email);
  btn.disabled = false; btn.innerHTML = '📧 ส่งรหัส OTP';
  if (r.ok){
    pendingEmail = email;
    $('#otpEmail').textContent = email;
    $('#emailForm').hidden = true;
    $('#otpForm').hidden = false;
    $('#msg').innerHTML = `<div class="msg msg--ok">✓ ส่งรหัสไปที่ ${email} แล้ว</div>`;
    setTimeout(()=>$('#otpInput').focus(), 100);
  } else {
    $('#msg').innerHTML = `<div class="msg msg--err">✗ ${r.error||'error'}</div>`;
  }
});

// 4) ยืนยัน OTP
$('#otpForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#otpBtn'); btn.disabled = true; btn.innerHTML = '<span class="yp-spinner"></span> กำลังยืนยัน…';
  const otp = $('#otpInput').value.trim();
  const r = await window.YP_AUTH.magicVerify(pendingEmail, otp);
  btn.disabled = false; btn.innerHTML = '✓ ยืนยัน';
  if (r.ok){
    window.YP_AUTH.setToken(r.session);
    $('#msg').innerHTML = `<div class="msg msg--ok">✓ เข้าสู่ระบบสำเร็จ</div>`;
    setTimeout(()=> location.replace(sessionStorage.getItem('yp:back')||'index.html'), 500);
  } else {
    $('#msg').innerHTML = `<div class="msg msg--err">✗ ${r.error||'error'}</div>`;
  }
});
$('#otpBack').onclick = () => { $('#otpForm').hidden = true; $('#emailForm').hidden = false; $('#msg').innerHTML=''; };

// 4) Google Sign-In
const cfg = window.YP_CONFIG||{};
if (cfg.GOOGLE_CLIENT_ID){
  $('#gDiv').hidden = false;
  function initGoogle(){
    if (typeof google === 'undefined' || !google.accounts) { setTimeout(initGoogle, 200); return; }
    google.accounts.id.initialize({
      client_id: cfg.GOOGLE_CLIENT_ID,
      use_fedcm_for_prompt: true,
      use_fedcm_for_button: true,
      callback: async (resp) => {
        $('#msg').innerHTML = '<div class="msg msg--ok"><span class="yp-spinner"></span> กำลังเข้าสู่ระบบ…</div>';
        try {
          const r = await window.YP_AUTH.googleLogin(resp.credential);
          if (r.ok){ window.YP_AUTH.setToken(r.session); location.reload(); }
          else $('#msg').innerHTML = `<div class="msg msg--err">${r.error||'error'}</div>`;
        } catch(err){
          $('#msg').innerHTML = `<div class="msg msg--err">${err.message}</div>`;
        }
      }
    });
    google.accounts.id.renderButton($('#gBtn'), {theme:'outline', size:'large', width:320, text:'continue_with'});
  }
  initGoogle();
}

// 5) Logout
$('#logoutBtn').onclick = async () => {
  await window.YP_AUTH.logout();
  location.reload();
};
</script>
</body>
</html>
