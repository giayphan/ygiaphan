<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ygiaphan</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/main.css?v=20260518">
</head>
<body>
<div data-include="header"></div>
<main class="container">
  <article class="page">
    <h1 data-i18n="about_title"></h1>
    <div data-content>
      <p class="vi">ygiaphan là blog dạy tiếng Thái cho người Việt, với nội dung vui, dễ hiểu và dùng được ngay.</p>
      <p class="th">ygiaphan คือบล็อกสอนภาษาเวียดนามสำหรับคนไทย ที่ตั้งใจทำเนื้อหาให้สนุก เข้าใจง่าย และใช้ได้จริง</p>
    </div>

    <section class="donate" id="donate">
      <h2>💚 <span data-t="donate_thanks">Support us</span></h2>
      <p class="muted" id="donateIntro">If the content helps you, buy us a coffee 🍵</p>
      <div class="donate__grid" id="donateGrid"></div>
      <div class="donate__thanks" id="donateThanks"></div>
      <details class="donate__log">
        <summary data-t="donate_log_title">Report transfer</summary>
        <form id="donateForm">
          <input name="name" id="donateName" placeholder="Name" maxlength="50">
          <div style="display:flex;gap:8px">
            <input name="amount" id="donateAmount" type="number" placeholder="Amount" required min="1" style="flex:1">
            <select name="currency" style="width:90px">
              <option value="THB">THB ฿</option>
              <option value="VND">VND ₫</option>
              <option value="USD">USD $</option>
            </select>
          </div>
          <select name="channel" required>
            <option value="" id="donateChanPh">— Channel —</option>
            <option value="promptpay">PromptPay 🇹🇭</option>
            <option value="momo">MoMo 🇻🇳</option>
            <option value="vietqr">VietQR / Bank 🇻🇳</option>
            <option value="paypal">PayPal 🌐</option>
          </select>
          <textarea name="note" id="donateNote" placeholder="Note (optional)" maxlength="500"></textarea>
          <button class="btn btn--primary" type="submit" data-t="donate_send">Send</button>
          <p id="donateMsg" class="muted"></p>
        </form>
      </details>
    </section>
  </article>
</main>

<style>
  .donate{margin-top:40px;padding:24px;background:var(--brand-bg);border-radius:16px}
  .donate h2{margin:0 0 6px;color:var(--brand)}
  .donate__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}
  .donate__item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
  .donate__item img{max-width:100%;height:auto;border-radius:8px;margin-bottom:8px}
  .donate__item strong{display:block;color:var(--brand);margin-bottom:4px}
  .donate__item code{background:var(--green-soft);padding:4px 8px;border-radius:6px;font-size:.9em;user-select:all;cursor:pointer}
  .donate__item a{display:inline-block;background:var(--brand);color:#fff;padding:8px 16px;border-radius:8px;text-decoration:none;font-weight:600;margin-top:8px}
  .donate__item a:hover{background:#236d3e}
  .donate__log{margin-top:16px}
.donate__log summary{cursor:pointer;font-weight:600;color:var(--brand)}
  .donate__log form{display:grid;gap:8px;margin-top:12px}
  .donate__log input,.donate__log textarea,.donate__log select{
    padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff
  }
</style>
<div data-include="footer"></div>

<script src="content/config.js"></script>
<script src="content/i18n/vi.js"></script>
<script src="content/i18n/th.js"></script>
<script src="content/site.js"></script>
<script src="content/nav.js"></script>
<script src="assets/js/pwa.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/card.js"></script>
<script>
const T = window.YP_T||{};
document.documentElement.lang = window.YP_LANG||'vi';
document.querySelectorAll('[data-t]').forEach(el => { const k=el.dataset.t; if (T[k]) el.textContent = T[k]; });
document.querySelector('[data-i18n="about_title"]').textContent = T.about_title||'About';
// placeholders
const setPh = (id,k) => { const el=document.getElementById(id); if (el && T[k]) el.placeholder = T[k]; };
setPh('donateName','comment_name');
setPh('donateAmount','donate_amount');
setPh('donateNote','donate_note');
const chp = document.getElementById('donateChanPh'); if (chp) chp.textContent = '— '+(T.donate_channel||'Channel')+' —';
document.querySelectorAll('[data-content] p').forEach(p => p.hidden = (window.YP_LANG !== p.classList[0]));

// donate grid
const D = (window.YP_CONFIG||{}).DONATE||{};
const items = [];
const copyTitle = T.donate_copy||'Copy';
const copyDone = T.donate_copied||'✓';
const copyCode = (val,label) => `<code title="${copyTitle}" onclick="navigator.clipboard.writeText('${val}');this.textContent='${copyDone}';setTimeout(()=>this.textContent='${val}',1500)">${label||val}</code>`;
if (D.promptpay) items.push(`<div class="donate__item">
  <strong>PromptPay 🇹🇭</strong>
  ${D.promptpay_qr ? `<img src="${D.promptpay_qr}" alt="PromptPay QR">` : ''}
  ${copyCode(D.promptpay)}
</div>`);
if (D.momo) items.push(`<div class="donate__item">
  <strong>MoMo 🇻🇳</strong>
  ${D.momo_qr ? `<img src="${D.momo_qr}" alt="MoMo QR">` : ''}
  ${copyCode(D.momo)}
  <p class="muted" style="margin:6px 0 0;font-size:.8em">Ví điện tử</p>
</div>`);
if (D.vietqr) items.push(`<div class="donate__item">
  <strong>VietQR 🇻🇳</strong>
  ${D.vietqr_qr ? `<img src="${D.vietqr_qr}" alt="VietQR">` : ''}
  ${copyCode(D.vietqr)}
  ${D.vietqr_bank ? `<p class="muted" style="margin:6px 0 0;font-size:.8em">${D.vietqr_bank}</p>` : ''}
</div>`);
if (D.paypal) items.push(`<div class="donate__item">
  <strong>PayPal 🌐</strong>
  <p class="muted" style="margin:8px 0">USD · International</p>
  <a href="${D.paypal}" target="_blank" rel="noopener">PayPal →</a>
</div>`);
document.getElementById('donateGrid').innerHTML = items.join('') || '<p class="muted">—</p>';

// load thanks list
(async () => {
  try {
    const r = await window.YP_API.thanksList();
    if (r.ok && r.list && r.list.length){
      document.getElementById('donateThanks').innerHTML = `
        <h3 style="margin:20px 0 8px;color:var(--brand);font-size:1rem">💚 ${T.donate_thanks||'Thanks'}</h3>
        <div class="thanks-list">${r.list.map(d => `
          <span class="thanks-tag" title="${d.amount} THB">${d.name}</span>`).join('')}</div>`;
    }
  } catch(_){}
})();

// donate log form
document.getElementById('donateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.currentTarget;
  const msg = document.getElementById('donateMsg');
  const btn = f.querySelector('button');
  btn.disabled = true; btn.innerHTML = '<span class="yp-spinner"></span> '+(T.donate_sending||'…');
  try {
    const note = (f.currency.value && f.currency.value!=='THB' ? `[${f.currency.value}] ` : '') + (f.note.value||'');
    const r = await window.YP_API.donateLog(f.name.value, +f.amount.value, f.channel.value, note);
    if (r.ok){ msg.textContent = T.donate_success||'✓ thanks'; f.reset(); }
    else msg.textContent = '✗ '+(r.error||'error');
  } catch(_){ msg.textContent = 'network error'; }
  finally { btn.disabled = false; btn.innerHTML = T.donate_send||'Send'; }
});
</script>
</body>
</html>
