<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ygiaphan</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/main.css?v=20260516">
</head>
<body>
<div data-include="header"></div>

<main class="container">
  <article class="page">
    <h1 data-page-title></h1>
    <p data-page-intro></p>
    <div class="grid grid--3" data-courses-full></div>
  </article>
</main>

<div data-include="footer"></div>

<script src="content/i18n/vi.js"></script>
<script src="content/i18n/th.js"></script>
<script src="content/site.js"></script>
<script src="content/nav.js"></script>
<script src="content/courses.js"></script>
<script src="assets/js/pwa.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/card.js"></script>
<script>
(() => {
  const T = window.YP_T||{};
  document.querySelector('[data-page-title]').textContent = T.courses_page_title||'Courses';
  document.querySelector('[data-page-intro]').textContent = T.courses_page_intro||'';
  const list = window.YP_COURSES || [];
  document.querySelector('[data-courses-full]').innerHTML = list.map(c => `
    <div id="${c.id}" class="course">
      <div class="course__icon">${c.icon}</div>
      <h3>${window.pickL(c,'title')}</h3>
      <p>${window.pickL(c,'desc')}</p>
      <p style="margin-top:10px;font-size:13px">${window.pickL(c,'detail')}</p>
    </div>`).join('');
})();
</script>
</body>
</html>
