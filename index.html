<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ygiaphan</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/main.css?v=20260517">
</head>
<body>
<div data-include="header"></div>

<main class="container">

  <section class="slider" data-slider></section>

  <section class="section" id="daily" data-section-daily>
    <div class="section__head">
      <h2></h2>
      <span class="hint"></span>
    </div>
    <div class="filters" data-filters></div>
    <div class="grid" data-posts></div>
  </section>

  <section class="section" data-section-courses>
    <div class="section__head"><h2></h2></div>
    <div class="grid grid--3" data-courses></div>
  </section>

  <aside class="donate-mini" id="donateMini" hidden>
    <h3>💚 สนับสนุนเรา</h3>
    <p class="muted">ถ้าเนื้อหาช่วยคุณ ช่วยเลี้ยงกาแฟเราหน่อย 🍵</p>
    <div id="donateMiniGrid" class="donate-mini__grid"></div>
    <a class="btn btn--primary" href="about.html#donate">ดูช่องทางทั้งหมด →</a>
  </aside>

  <section id="supporters-section" class="section" style="display:none">
    <div id="supporters-wrap"></div>
  </section>

</main>

<div data-include="footer"></div>

<!-- Content (edit these to add posts / change site) -->
<script src="content/config.js"></script>
<script src="content/i18n/vi.js"></script>
<script src="content/i18n/th.js"></script>
<script src="content/site.js"></script>
<script src="content/nav.js"></script>
<script src="content/courses.js"></script>
<script src="content/slides.js"></script>
<script src="content/posts/_list.js"></script>
<script src="content/posts/greetings.js"></script>
<script src="content/posts/six-tones.js"></script>
<script src="content/posts/ordering-food.js"></script>
<script src="content/posts/numbers.js"></script>
<script src="content/posts/days-of-week.js"></script>
<script src="content/posts/colors.js"></script>
<script src="content/posts/family.js"></script>
<script src="content/posts/body-parts.js"></script>
<script src="content/posts/transportation.js"></script>
<script src="content/posts/weather.js"></script>

<!-- Engine -->
<script src="assets/js/marked.min.js"></script>
<script src="assets/js/pwa.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/card.js"></script>
<script src="assets/js/home.js"></script>
<script>
// donate mini widget
(function(){
  const D = (window.YP_CONFIG||{}).DONATE||{};
  const items = [];
  if (D.promptpay) items.push(`<div class="donate-mini__item"><strong>PromptPay 🇹🇭</strong>${D.promptpay_qr?`<img src="${D.promptpay_qr}" alt="QR">`:''}<code>${D.promptpay}</code></div>`);
  if (D.paypal)    items.push(`<div class="donate-mini__item"><strong>PayPal 🌐</strong><a href="${D.paypal}" target="_blank" rel="noopener">บริจาค</a></div>`);
  if (!items.length) return;
  document.getElementById('donateMiniGrid').innerHTML = items.join('');
  document.getElementById('donateMini').hidden = false;
})();
(async function(){
  if (!window.YP_CONFIG || !window.YP_CONFIG.USE_API) return;
  const wrap = document.getElementById('supporters-wrap');
  const sec  = document.getElementById('supporters-section');
  if (!wrap || !sec) return;
  try {
    const r = await window.YP_API.thanksList();
    console.log('[supporters]', r);
    if (!r || !r.ok) return;
    const list = r.list || [];
    if (!list.length) return;
    wrap.innerHTML =
      `<h3 style="margin:0 0 8px;color:var(--brand);font-size:1rem">💚 ขอบคุณผู้สนับสนุน</h3>
       <div class="thanks-list">${list.map(d =>
         `<span class="thanks-tag" title="${(+d.amount).toLocaleString()} THB">${d.name}</span>`
       ).join('')}</div>`;
    sec.style.display = '';
  } catch(e){ console.warn('[supporters] failed', e); }
})();
</script>
</body>
</html>
