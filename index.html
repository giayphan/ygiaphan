<script>
(async function(){
  if (!window.YP_CONFIG || !window.YP_CONFIG.USE_API) return;
  const wrap = document.getElementById('supporters-wrap');
  const sec  = document.getElementById('supporters-section');
  if (!wrap || !sec) return;
  try {
    const r = await window.YP_API.thanksList();
    if (!r || !r.ok) return;
    const list = r.list || [];
    if (!list.length) return;
    // aggregate by name: count + total
    const agg = {};
    for (const d of list){
      const k = (d.name||'ไม่ระบุ').trim();
      if (!agg[k]) agg[k] = {name:k, count:0, total:0};
      agg[k].count += 1;
      agg[k].total += (+d.amount||0);
    }
    const rows = Object.values(agg).sort((a,b)=>b.total-a.total);
    const items = rows.map(d => `<span class="supporters-ticker__item">💚 <b>${d.name}</b> <em>${d.total.toLocaleString()}฿</em></span>`).join('');
    wrap.innerHTML = items + items; // duplicate for seamless loop
    sec.style.display = '';
  } catch(e){ console.warn('[supporters] failed', e); }
})();
</script>
</body>
